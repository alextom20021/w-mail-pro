version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      - mysql
      - redis
    env_file: .env

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis
    env_file: .env
    # Polls the outbox every 5s. Swap for a Redis-consumer loop in Phase 2
    # once queue volume justifies moving off MySQL polling.
    command: ["sh", "-c", "while true; do php worker/worker.php 50; sleep 5; done"]

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    env_file: .env
    # Runs the AI meta-optimization loop (warm-up scheduler, anomaly
    # detector, A/B test winner selection) once a minute, per the spec's
    # "updated every minute" requirement.
    command: ["sh", "-c", "while true; do php worker/ai_cycle.php; sleep 60; done"]

  webhook_worker:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    env_file: .env
    # Drains queued webhook_deliveries and POSTs them to client endpoints
    # with retry/backoff — separate from `cron` since a burst of webhook
    # retries shouldn't compete with the per-minute AI cycle's cadence.
    command: ["sh", "-c", "while true; do php worker/webhook_worker.php; sleep 15; done"]

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mailai
      MYSQL_USER: mailai
      MYSQL_PASSWORD: change_me
      MYSQL_ROOT_PASSWORD: change_me_root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
